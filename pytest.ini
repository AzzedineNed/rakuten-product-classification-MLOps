[pytest]
testpaths = tests

# --strict-markers: an @pytest.mark.<typo> decorator becomes a COLLECTION ERROR
# instead of a silently-ignored no-op. Verified: it does NOT validate `-m`
# expressions — `pytest -m "not slwo"` still runs everything, quietly. So the
# marker is a convenience, never a safety mechanism (see below).
addopts = --strict-markers

# `slow` means: needs a REAL MLflow registry (SQLite + a local artifact store).
# Those tests stand up a database and log artifacts; measured on the dev laptop
# they are the large majority of the suite's wall time. Skip them while
# iterating:
#
#     pytest -m "not slow"        (or: make test-fast)
#
# They are NOT optional, and nothing about CI depends on this marker: the
# mlflow CI job runs the WHOLE suite with no marker filter, so a test that
# someone forgets to mark still runs there. Before merging, run the full suite.
markers =
    slow: needs a real MLflow registry; excluded by `make test-fast`
