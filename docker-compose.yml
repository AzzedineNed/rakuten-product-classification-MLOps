services:
  api:
    build: .
    image: rakuten-image-mlops:latest
    container_name: rakuten-image-api
    # No host port: the API is only reachable through the nginx proxy below.
    # (For direct access during debugging, uncomment:)
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    # Explicit per-service command: one image serves all three services, so the
    # Dockerfile CMD is only a default. Being explicit here means the compose
    # file alone tells you what each container runs.
    command: ["uvicorn", "api.image_main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Persist data, trained models and reports on the host.
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      # Cache downloaded backbone weights across runs.
      - torch-cache:/root/.cache/torch
    environment:
      - RAKUTEN_CLASSIFIER=mlp
    # Inject secrets (MLflow/DagsHub creds) at RUNTIME — .env is excluded from
    # the image by .dockerignore, so this is the only way the container gets
    # them, and they never end up baked into image layers.
    env_file:
      - .env
    restart: unless-stopped

    # Measured on the target machine (WSL2, 4.807 GiB available to Docker):
    #   idle 47 MiB | serving, torch+model loaded 442 MiB | peak during a full
    #   retrain ~1.48 GiB. The limit below is ~70% above the measured peak so a
    #   retrain cannot be OOM-killed, while still capping a runaway process.
    #   Re-measure with `docker stats` before lowering it.
    mem_limit: 2.5g

    # The image has no curl/wget (python:3.11-slim), so we use stdlib urllib.
    # /health imports torch on first call, hence the tolerant timeout/retries:
    # a slow reply during training must not flap the container to unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=8).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

    # --- Optional GPU (nvidia-container-toolkit, no Docker Desktop) ---
    # Uncomment to expose your GPU. Not needed for this pipeline.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  text-api:
    build: .
    image: rakuten-image-mlops:latest
    container_name: rakuten-text-api
    expose:
      - "8001"
    command: ["uvicorn", "api.text_main:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      # WRITABLE as of the commit that gave this service a /train endpoint.
      #
      # It was read-only before, and the reasoning behind that is still sound
      # FOR SERVING: MLflow downloads a registered version to a temp dir
      # (mlflow.utils.file_utils.create_tmp_dir falls through to
      # tempfile.mkdtemp(), i.e. /tmp in this container — verified in the
      # installed mlflow 3.14.0 source), never into models/, so a serving-only
      # container genuinely never needs to write here. Training does:
      # scripts/train_text.py writes models/text/{tfidf_vectorizer,
      # logistic_regression}.pkl and split.json. The requirement changed, so
      # the mount changed with it rather than the comment quietly disagreeing
      # with the line under it.
      - ./models:/app/models
      # READ-ONLY: training reads data/raw/X_train*.csv via config.RAW_DIR and
      # must never modify the dataset. Not mounted at all before this commit.
      - ./data:/app/data:ro
      # Writable: metrics_text_train.json, the classification report and the
      # confusion matrix land in reports/text/.
      - ./reports:/app/reports
    # Registry-aware serving needs the DagsHub MLflow credentials at RUNTIME.
    # Without this the container has no MLFLOW_TRACKING_URI, so it would fall
    # back to the local .pkl files forever while looking like it resolves an
    # alias — the exact failure this step exists to remove.
    #
    # FOLLOW-UP (least privilege): .env also carries ENS_USERNAME/ENS_PASSWORD,
    # which this service never uses. Passing only what it needs looks like:
    #   environment:
    #     - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
    #     - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
    #     - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
    # Not done here because compose's interpolation from ./.env could not be
    # verified in the sandbox, and env_file is the mechanism already proven on
    # the `api` service.
    env_file:
      - .env
    restart: unless-stopped

    # MEASURED, not guessed. Sampled every 2s through a full in-container
    # retrain (POST /text/train, 78.2s fit over 67932 products):
    #   serving only 181 MiB | RETRAIN PEAK 841.8 MiB | settled after 360.4 MiB.
    # The settled figure is higher than the pre-training 181 MiB because CPython
    # does not return all freed arenas to the OS, so it is the container's new
    # resting size, not a leak.
    #
    # 1.5g is the peak plus ~78% headroom, the same proportion the image
    # service's 2.5g gives its 1.48 GiB peak. The previous 1g would have put the
    # peak at 84% of the ceiling — survivable on this run, and one larger
    # vocabulary away from an OOM kill mid-training.
    mem_limit: 1.5g

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/health', timeout=8).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  gateway:
    build: .
    image: rakuten-image-mlops:latest
    container_name: rakuten-gateway
    expose:
      - "8002"
    command: ["uvicorn", "api.gateway_main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      # Service names on the compose network, not localhost.
      - RAKUTEN_IMAGE_API_URL=http://api:8000
      - RAKUTEN_TEXT_API_URL=http://text-api:8001
    # No volumes: the gateway owns no model and reads no data. It is a
    # coordinator that calls the other two over HTTP.
    depends_on:
      # Wait for both upstreams to be SERVING, not merely started, so the
      # gateway never comes up in front of dead backends.
      api:
        condition: service_healthy
      text-api:
        condition: service_healthy
    restart: unless-stopped

    # PROVISIONAL — NOT MEASURED. Should be the smallest of the three: numpy,
    # requests and FastAPI, no model, no torch.
    mem_limit: 512m

    healthcheck:
      # /health is deliberately 200 even when an upstream is down (the gateway
      # itself is fine and can still serve single-modality predictions), so
      # this probes the gateway, not the backends.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8002/health', timeout=8).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: rakuten-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Create once with: printf "admin:$(openssl passwd -apr1)\n" > nginx/.htpasswd
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      # Wait for every upstream to be actually serving, not merely started, so
      # the proxy never comes up in front of a dead backend. nginx resolves all
      # three upstream names at startup and refuses to boot if one is missing.
      api:
        condition: service_healthy
      text-api:
        condition: service_healthy
      gateway:
        condition: service_healthy
      # Added with the /grafana/ and /prometheus/ routes: nginx resolves ALL
      # upstream names at startup and refuses to boot if one does not exist,
      # so these two are now boot dependencies, not optional extras.
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    # nginx:alpine ships busybox wget. Probing /health goes through to the API,
    # so this checks the whole proxy -> upstream path, not just nginx itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- MONITORING (mentor item 5) ---------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: rakuten-prometheus
    # No host port, same rule as every other service: nginx on :80 stays the
    # only public entrypoint. Reaching the Prometheus UI is handled separately.
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # A NAMED volume, not a bind mount, on purpose: the prom/prometheus image
      # runs as nobody (uid 65534) and declares /prometheus as a VOLUME, so a
      # named volume inherits the right ownership. A ./bind mount would be
      # owned by the host user and Prometheus would fail to write its TSDB.
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days on a laptop with four targets is a few tens of MB. The default
      # is also 15d; stated explicitly so it is a decision, not an accident.
      - --storage.tsdb.retention.time=15d
      # Tells Prometheus the URL humans reach it on, so its redirects and the
      # links in its own UI carry the /prometheus/ prefix nginx adds.
      # route-prefix stays "/" DELIBERATELY: it keeps the API reachable at
      # http://prometheus:9090/api/v1/... from inside the compose network,
      # which is how Grafana queries it. Setting route-prefix to /prometheus/
      # would move the API too and break the datasource.
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost/prometheus/}
      - --web.route-prefix=/
    # NOT gated on the services being healthy, deliberately. Monitoring that
    # refuses to start until the things it monitors are healthy is backwards:
    # a target that is down should show up{job=...}==0 on the dashboard, which
    # requires Prometheus to already be running. Prometheus tolerates dead
    # targets by design.
    restart: unless-stopped

    # PROVISIONAL — NOT MEASURED. Four targets at 15s is a trivial workload,
    # but the TSDB head block and query engine are not free. Confirm with
    # `docker stats` and tighten, the same way the other limits were.
    mem_limit: 512m

    # VERIFIED on prom/prometheus:v3.0.0: the image ships busybox wget at
    # /bin/wget and no curl, so this uses the same wget form as the nginx
    # service above. /-/healthy is Prometheus's own liveness endpoint and does
    # not depend on any scrape target being reachable — a stack where every
    # target is down should still show Prometheus itself as healthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rakuten-grafana
    # Same rule as everything else: no host port. Reaching the UI is nginx's
    # job (next step). Until then it is only reachable inside the network.
    expose:
      - "3000"
    volumes:
      # Provisioning is read-only and versioned in git. A datasource or
      # dashboard created by hand in the browser would live only in Grafana's
      # sqlite DB inside the volume below, and vanish if that volume is reset.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # VERIFIED: the image runs as uid 472 gid 0 and declares /var/lib/grafana
      # as a VOLUME, so a NAMED volume gets the right ownership. A ./bind mount
      # would be owned by the host user and Grafana would fail to write.
      - grafana-data:/var/lib/grafana
    environment:
      # `?` form: compose REFUSES TO START if the variable is unset, instead of
      # silently falling back to Grafana's default admin/admin on a service that
      # is about to be published through nginx. Set it in .env (gitignored).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # No anonymous access and no sign-up: this is reachable from the LAN once
      # nginx proxies it.
      # Grafana is reached at http://<host>/grafana/ through nginx. Both of
      # these are required: ROOT_URL so generated links carry the prefix, and
      # SERVE_FROM_SUB_PATH so Grafana serves under it. With SERVE_FROM_SUB_PATH
      # true, nginx must NOT strip the prefix — see nginx/default.conf, where
      # the proxy_pass for /grafana/ deliberately has no trailing slash.
      # Override GRAFANA_ROOT_URL in .env if you reach the host by LAN IP
      # rather than localhost.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Telemetry off — this is a coursework stack, not a fleet.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    # Grafana starts fine without Prometheus and shows the datasource as down,
    # which is the more useful failure mode than refusing to boot.
    depends_on:
      - prometheus
    restart: unless-stopped

    # PROVISIONAL — NOT MEASURED. Measure with `docker stats` and tighten.
    mem_limit: 512m

    # VERIFIED on grafana/grafana:11.3.0: the image ships BOTH wget and curl.
    # /api/health is Grafana's own endpoint and does not require auth.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  torch-cache:
  prometheus-data:
  grafana-data:
