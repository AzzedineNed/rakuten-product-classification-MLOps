# Nginx reverse proxy in front of the image API ("sécurisation").
#
# What it adds on top of raw uvicorn:
#   * single public entrypoint on :80 — the API container is NOT published
#     to the host anymore, only reachable through this proxy
#   * per-IP rate limiting (cheap DoS protection)
#   * request body cap (uploads are single product images)
#   * HTTP basic auth on the /train and /evaluate endpoints (retraining and
#     evaluation are not for anonymous callers; /predict and /health stay open)
#   * hides the server version banner
#
# Auth file: create it once on the host (NOT committed — gitignored):
#   printf "admin:$(openssl passwd -apr1)\n" > nginx/.htpasswd
# (prompts for the password; add more users by appending lines)
#
# SERVICE SPLIT (image / text / fusion) — routing is DELIBERATELY NON-BREAKING:
# the original paths (/health, /predict, /train, /evaluate) still reach the
# IMAGE service, because the Airflow DAG drives those exact paths. The two new
# services live under prefixes:
#
#   /              -> image service   (unchanged)
#   /predict       -> image service   (unchanged, multipart image upload)
#   /train,/evaluate -> image service (unchanged, basic auth)
#   /text/...      -> text service    (prefix stripped: /text/predict -> /predict)
#   /fusion/...    -> gateway         (prefix stripped: /fusion/predict -> /predict)
#
# The trailing slash on both the location and the proxy_pass target is what
# strips the prefix. Removing either one silently forwards /text/predict as
# /text/predict to the upstream, which 404s.

# Per-client-IP rate-limit zones.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=train:10m   rate=1r/s;

upstream rakuten_image_api {
    server api:8000;   # docker-compose service name
}

upstream rakuten_text_api {
    server text-api:8001;
}

upstream rakuten_gateway {
    server gateway:8002;
}

server {
    listen 80;
    server_name _;

    server_tokens off;          # don't advertise the nginx version
    client_max_body_size 10m;   # product images are small; cap uploads
    limit_req_status 429;       # Too Many Requests (nginx default is a misleading 503)

    # Standard proxy headers so FastAPI sees the real client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Everything not matched below (/health, /docs, /openapi.json, ...).
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://rakuten_image_api;
    }

    location /predict {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://rakuten_image_api;
        # First prediction in a fresh process loads the backbone and may pull
        # the model from the MLflow registry — allow more than the 60s default.
        proxy_read_timeout 180s;
    }

    # Retraining endpoints are gated behind basic auth.
    location /train {
        auth_basic "Rakuten image API - training";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        proxy_pass http://rakuten_image_api;
    }

    # Evaluation is gated the same way and for the same reasons: it is a
    # long-running CPU job (~20s in-container over the cached test features) and
    # it overwrites reports/. Without this block it would fall through to
    # `location /` — open to anonymous callers at 10r/s. The prefix match covers
    # /evaluate/status too, exactly as /train covers /train/status.
    location /evaluate {
        auth_basic "Rakuten image API - evaluation";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        proxy_pass http://rakuten_image_api;
    }

    # --- TEXT service -----------------------------------------------------
    # Cheap and fast (a TF-IDF transform plus a logreg dot product), so it sits
    # in the general rate-limit zone. No auth: it is a read-only predictor,
    # exactly like the image /predict.
    location /text/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://rakuten_text_api/;
    }

    # --- FUSION gateway ---------------------------------------------------
    # One request here fans out to BOTH upstreams, so it inherits the image
    # service's slow first-prediction problem: the same 180s ceiling applies.
    location /fusion/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://rakuten_gateway/;
        proxy_read_timeout 180s;
    }

    # Convenience: /text and /fusion without the trailing slash would fall
    # through to `location /` and hit the IMAGE service, which is confusing
    # rather than wrong. Redirect instead.
    location = /text   { return 301 /text/; }
    location = /fusion { return 301 /fusion/; }
}