# Nginx reverse proxy in front of the image API ("sécurisation").
#
# What it adds on top of raw uvicorn:
#   * single public entrypoint on :80 - the API container is NOT published
#     to the host anymore, only reachable through this proxy
#   * per-IP rate limiting (cheap DoS protection)
#   * request body cap (uploads are single product images)
#   * HTTP basic auth on the /train and /evaluate endpoints (retraining and
#     evaluation are not for anonymous callers; /predict and /health stay open)
#   * hides the server version banner
#
# Auth file: create it once on the host (NOT committed - gitignored):
#   printf "admin:$(openssl passwd -apr1)\n" > nginx/.htpasswd
# (prompts for the password; add more users by appending lines)
#
# SERVICE SPLIT (image / text / fusion) - routing is DELIBERATELY NON-BREAKING:
# the original paths (/health, /predict, /train, /evaluate) still reach the
# IMAGE service, because the Airflow DAG drives those exact paths. The two new
# services live under prefixes:
#
#   /              -> image service   (unchanged)
#   /predict       -> image service   (unchanged, multipart image upload)
#   /train,/evaluate -> image service (unchanged, basic auth)
#   /text/...      -> text service    (prefix stripped: /text/predict -> /predict)
#   /text/train, /text/evaluate -> text service (basic auth, see below)
#   /fusion/...    -> gateway         (prefix stripped: /fusion/predict -> /predict)
#   /grafana/...   -> grafana         (prefix PRESERVED - see the block below)
#   /prometheus/...-> prometheus      (prefix stripped, basic auth)
#
# HOW THE PREFIX IS STRIPPED, AND WHY IT IS NOT A TRAILING SLASH ANY MORE:
# every proxy_pass below targets a VARIABLE, which is what forces nginx to
# resolve the backend name per request instead of once at startup (see the
# resolver block). A variable proxy_pass turns OFF nginx's automatic
# "replace the matched prefix with the proxy_pass URI" rewrite, so the three
# stripping locations do it explicitly with `rewrite ... break`. Deleting a
# rewrite line silently forwards /text/predict as /text/predict, which 404s:
# exactly the failure the old trailing slash had.

# Websocket upgrade helper, used by the Grafana location below. Without this
# map, `proxy_set_header Connection $connection_upgrade` references an
# undefined variable and nginx REFUSES TO START. It must live at http level,
# not inside server{}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-client-IP rate-limit zones.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=train:10m   rate=1r/s;
# The monitoring UIs need their OWN, much higher zone. A single Grafana
# dashboard load fires dozens of parallel requests (one per panel query, plus
# static assets); at the general zone's 10r/s burst 20 the browser would start
# collecting 429s and panels would render as errors. This is a human-facing UI
# behind authentication, not an API surface worth throttling hard.
limit_req_zone $binary_remote_addr zone=ui:10m      rate=30r/s;

server {
    listen 80;
    server_name _;

    # RUNTIME DNS. 127.0.0.11 is Docker's embedded DNS server, present on every
    # user-defined compose network. This is the whole point of the file's
    # variable proxy_pass targets: nginx resolves a backend name when a request
    # arrives, not once at startup.
    #
    # WITHOUT IT (upstream blocks, or a literal name in proxy_pass) nginx binds
    # the container IP it saw at boot and keeps it forever. `docker compose up
    # -d --force-recreate` gives a service a NEW IP, and every request through
    # here 502s until nginx is restarted by hand. `docker compose restart
    # <service>` reuses the IP, which is why that case never showed the bug.
    #
    # valid=10s caps how long a resolved address is reused. A recreate is
    # therefore invisible after at most 10 seconds instead of forever.
    # ipv6=off because none of these services listen on IPv6 and asking for a
    # AAAA record only adds a failed lookup per name.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend addresses, as compose service name plus port. These are plain
    # strings, NOT upstream group names: nginx checks its configured upstream
    # groups before it consults the resolver, so naming a group here would
    # quietly restore the startup-time binding this file exists to avoid.
    set $rakuten_image_api  api:8000;
    set $rakuten_text_api   text-api:8001;
    set $rakuten_gateway    gateway:8002;
    set $rakuten_grafana    grafana:3000;
    set $rakuten_prometheus prometheus:9090;

    server_tokens off;          # don't advertise the nginx version
    client_max_body_size 10m;   # product images are small; cap uploads
    limit_req_status 429;       # Too Many Requests (nginx default is a misleading 503)

    # Standard proxy headers so FastAPI sees the real client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Everything not matched below (/health, /docs, /openapi.json, ...).
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$rakuten_image_api;
    }

    location /predict {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$rakuten_image_api;
        # First prediction in a fresh process loads the backbone and may pull
        # the model from the MLflow registry - allow more than the 60s default.
        proxy_read_timeout 180s;
    }

    # Retraining endpoints are gated behind basic auth.
    location /train {
        auth_basic "Rakuten image API - training";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        proxy_pass http://$rakuten_image_api;
    }

    # Evaluation is gated the same way and for the same reasons: it is a
    # long-running CPU job (~20s in-container over the cached test features) and
    # it overwrites reports/. Without this block it would fall through to
    # `location /` - open to anonymous callers at 10r/s. The prefix match covers
    # /evaluate/status too, exactly as /train covers /train/status.
    location /evaluate {
        auth_basic "Rakuten image API - evaluation";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        proxy_pass http://$rakuten_image_api;
    }

    # --- TEXT service -----------------------------------------------------
    # Cheap and fast (a TF-IDF transform plus a logreg dot product), so it sits
    # in the general rate-limit zone. No auth: it is a read-only predictor,
    # exactly like the image /predict.
    #
    # THIS BLOCK IS A PREFIX MATCH, SO IT WOULD ALSO COVER /text/train. The two
    # authenticated blocks below exist because of that: nginx picks the LONGEST
    # matching prefix, so /text/train and /text/evaluate land there instead of
    # here. Without them, adding a training route to the text service would
    # publish it to anonymous callers at 10r/s - able to overwrite
    # models/text/*.pkl and register model versions. The image service has been
    # protected this way since the beginning; this closes the same hole on the
    # text side BEFORE the endpoints exist rather than after.
    location /text/ {
        limit_req zone=general burst=20 nodelay;
        rewrite ^/text/(.*)$ /$1 break;
        proxy_pass http://$rakuten_text_api;
    }

    # Same auth, same htpasswd file and same slow-job rate-limit zone as the
    # image /train and /evaluate. The rewrite drops the /text prefix, so
    # /text/train -> /train and /text/train/status -> /train/status, which is
    # what the polling loop in the Airflow DAG needs.
    location /text/train {
        auth_basic "Rakuten text API - training";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        rewrite ^/text/(.*)$ /$1 break;
        proxy_pass http://$rakuten_text_api;
        # Text training measured at ~3 min on the host. The POST returns
        # immediately (the job runs in the background) but the ceiling is raised
        # anyway so a slow accept cannot 504 mid-handshake.
        proxy_read_timeout 180s;
    }

    location /text/evaluate {
        auth_basic "Rakuten text API - evaluation";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=train burst=5 nodelay;
        rewrite ^/text/(.*)$ /$1 break;
        proxy_pass http://$rakuten_text_api;
        proxy_read_timeout 180s;
    }

    # --- FUSION gateway ---------------------------------------------------
    # One request here fans out to BOTH upstreams, so it inherits the image
    # service's slow first-prediction problem: the same 180s ceiling applies.
    location /fusion/ {
        limit_req zone=general burst=20 nodelay;
        rewrite ^/fusion/(.*)$ /$1 break;
        proxy_pass http://$rakuten_gateway;
        proxy_read_timeout 180s;
    }

    # --- MONITORING UIs ---------------------------------------------------
    # Grafana. NOTE there is NO rewrite here, unlike /text/ and /fusion/ above,
    # and that is deliberate. Grafana runs with GF_SERVER_SERVE_FROM_SUB_PATH
    # =true, which means Grafana itself serves under /grafana/ and expects to
    # RECEIVE that prefix. Stripping it would make every asset 404.
    #
    # NO nginx basic auth, unlike /train and /evaluate. Grafana has its own
    # login with real user accounts and sessions; stacking basic auth on top
    # would mean two prompts for one page and would break the API calls the
    # dashboard makes after login. The password comes from .env.
    location /grafana/ {
        limit_req zone=ui burst=60 nodelay;
        proxy_pass http://$rakuten_grafana;
        proxy_set_header Host $host;
        # Grafana Live (dashboard streaming) uses websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Prometheus. The prefix IS stripped here because Prometheus runs with
    # --web.route-prefix=/ and only --web.external-url pointing at
    # /prometheus/. That combination is chosen so the API stays reachable at
    # http://prometheus:9090/api/v1/... from inside the compose network - which
    # is how Grafana queries it, and how the target checks were run. Setting
    # route-prefix to /prometheus/ would have broken both.
    #
    # BASIC AUTH, unlike Grafana: Prometheus has NO authentication of its own,
    # and its UI can read every metric and, more to the point, its /api/v1/
    # surface is wide open. Same htpasswd file as /train and /evaluate.
    location /prometheus/ {
        auth_basic "Rakuten monitoring - Prometheus";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=ui burst=60 nodelay;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://$rakuten_prometheus;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Convenience: /text and /fusion without the trailing slash would fall
    # through to `location /` and hit the IMAGE service, which is confusing
    # rather than wrong. Redirect instead.
    location = /text   { return 301 /text/; }
    location = /fusion { return 301 /fusion/; }
    location = /grafana    { return 301 /grafana/; }
    location = /prometheus { return 301 /prometheus/; }
}
